version: 2
updates:
  - package-ecosystem: swift
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    # One PR for all actions: github/codeql-action's init/analyze/upload-sarif must move together,
    # and separate PRs leave them on mismatched versions so every one fails.
    groups:
      actions:
        patterns: ['*']
    ignore:
      # scorecard-action v2.6.0 pins a Docker image digest that is missing from GHCR, so every run fails at the image pull.
      - dependency-name: ossf/scorecard-action
        versions: ['2.6.0']
